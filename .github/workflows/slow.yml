name: Slow tests

# The full seed sweeps and statistical tests (`SLOW=1`). Not a PR check and
# not required for merging: it runs after every push to master and nightly, so
# a regression the fast `test` check cannot see shows up as a red run here.

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: SLOW=1 bun test --parallel
